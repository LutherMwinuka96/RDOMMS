<!DOCTYPE html>
<html lang="en">
<head>
<script src="../assets/js/rdomms-security.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RDO|MMS – Approval Requests</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/vendor/fontawesome/css/all.min.css">
<link rel="stylesheet" href="../assets/css/rdomms-icons-offline.css">
<link rel="stylesheet" href="../assets/css/rdomms-toast.css">
<script src="../assets/js/rdomms-toast.js"></script>
<style>
:root { --primary:#2d5016; --secondary:#4a7c28; --dark:#1a3009; --danger:#dc3545; --success:#28a745; --text:#212529; --muted:#6c757d; --border:#dee2e6; --radius:0.75rem; }
*{box-sizing:border-box;margin:0;padding:0} body{font-family:Inter,sans-serif;background:#f0f4f1;color:var(--text);min-height:100vh}
.page{max-width:1200px;margin:0 auto;padding:1.25rem 1.25rem 3rem}
.page-loading{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;background:rgba(15,36,20,.35);color:#fff;font-weight:600;gap:.75rem}
.page-loading.hidden{display:none}
.hero{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding:1.25rem 1.5rem;background:linear-gradient(135deg,var(--dark),var(--primary));color:#fff;border-radius:1rem;margin-bottom:1rem}
.hero h1{font-size:1.6rem}.hero p{opacity:.92;margin-top:.35rem}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem .9rem;border-radius:var(--radius);border:none;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn-outline{background:#fff;color:var(--primary)} .btn-primary{background:var(--secondary);color:#fff} .btn-light{background:#fff;border:1px solid var(--border);color:var(--primary)} .btn-success{background:var(--success);color:#fff} .btn-danger{background:var(--danger);color:#fff} .btn-sm{padding:.35rem .55rem;font-size:.75rem}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1rem}
@media(max-width:900px){.stats-grid{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr!important}}
.stat-card,.panel{background:#fff;border:1px solid var(--border);border-radius:1rem;padding:1rem}
.stat-label{font-size:.75rem;color:var(--muted)} .stat-value{font-size:1.4rem;font-weight:800;color:var(--primary);margin-top:.15rem}
.layout{display:grid;grid-template-columns:1.4fr 1fr;gap:1rem;align-items:start}
.tab-bar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.75rem}
.tab-btn{padding:.45rem .8rem;border:1px solid var(--border);background:#fff;border-radius:999px;cursor:pointer;font:inherit;font-weight:600}
.tab-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.filter-bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;margin-bottom:.75rem}
@media(max-width:700px){.filter-bar{grid-template-columns:1fr}}
.form-control,.filter-bar input,.filter-bar select{width:100%;padding:.7rem;border:1px solid var(--border);border-radius:var(--radius);font:inherit}
.form-group{display:flex;flex-direction:column;gap:.35rem;margin-bottom:.75rem}
.form-group label{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase}
.request-card{border:1px solid var(--border);border-radius:var(--radius);padding:.85rem;margin-bottom:.65rem}
.request-title{font-weight:700;margin-bottom:.25rem}.request-meta,.request-desc{font-size:.82rem;color:var(--muted);margin-top:.25rem}
.request-desc.reject{color:#b91c1c}.request-actions{display:flex;gap:.5rem;margin-top:.65rem;flex-wrap:wrap}
.badge{display:inline-block;padding:.15rem .45rem;border-radius:999px;font-size:.65rem;font-weight:700;text-transform:uppercase;background:#eef7ef;color:var(--primary)}
.empty-state{text-align:center;padding:2rem;color:var(--muted)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9999;padding:1rem}
.modal-overlay.open{display:flex}.modal{background:#fff;border-radius:1rem;padding:1.25rem;max-width:480px;width:100%}
.muted{color:var(--muted);font-size:.82rem}
</style>
</head>
<body>
<div id="pageLoading" class="page-loading hidden"><i class="fas fa-spinner fa-spin"></i> Loading requests…</div>
<div class="page">
  <div class="hero">
    <div>
      <h1><i class="fas fa-clipboard-check"></i> Approval Requests</h1>
      <p>Submit, review, and resolve approval requests stored in the database.</p>
    </div>
    <div class="header-actions">
      <a href="../RDOMMS.html" class="btn btn-outline"><i class="fas fa-house"></i> Dashboard</a>
      <a href="system-alerts.php" class="btn btn-light"><i class="fas fa-bell"></i> System Alerts</a>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card"><div class="stat-label">All</div><div class="stat-value" id="countAll">0</div></div>
    <div class="stat-card"><div class="stat-label">Pending</div><div class="stat-value" id="countPending">0</div></div>
    <div class="stat-card"><div class="stat-label">Approved</div><div class="stat-value" id="countApproved">0</div></div>
    <div class="stat-card"><div class="stat-label">Rejected</div><div class="stat-value" id="countRejected">0</div></div>
  </div>

  <div class="layout">
    <section class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem">
        <h2 style="font-size:1rem;color:var(--primary)"><i class="fas fa-inbox"></i> Requests Queue</h2>
        <span class="badge"><span id="pendingCount">0</span> pending</span>
      </div>
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="all">All</button>
        <button class="tab-btn" data-tab="pending">Pending</button>
        <button class="tab-btn" data-tab="approved">Approved</button>
        <button class="tab-btn" data-tab="rejected">Rejected</button>
      </div>
      <div class="filter-bar">
        <input id="searchInput" type="search" placeholder="Search requests…">
        <select id="filterModule"><option value="">All modules</option><option>Finance</option><option>Projects</option><option>Users</option><option>Procurement</option><option>HR</option></select>
        <select id="filterPriority"><option value="">All priorities</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select>
      </div>
      <div id="requestList"></div>
      <div class="empty-state" id="emptyState" style="display:none">No requests match your filters.</div>
    </section>

    <aside class="panel">
      <h2 style="font-size:1rem;color:var(--primary);margin-bottom:.75rem"><i class="fas fa-plus-circle"></i> New Request</h2>
      <div class="form-group"><label for="newTitle">Title *</label><input id="newTitle" class="form-control" type="text"></div>
      <div class="form-group"><label for="newType">Type *</label><select id="newType" class="form-control"><option value="">Select type</option><option>Budget Approval</option><option>Leave Request</option><option>User Role Change</option><option>Document Sign-off</option><option>Other</option></select></div>
      <div class="form-group"><label for="newModule">Module</label><select id="newModule" class="form-control"><option>Finance</option><option>Projects</option><option>Users</option><option>Procurement</option><option>HR</option></select></div>
      <div class="form-group"><label for="newPriority">Priority</label><select id="newPriority" class="form-control"><option value="medium">Medium</option><option value="high">High</option><option value="low">Low</option></select></div>
      <div class="form-group"><label for="newRequester">Requested by *</label><input id="newRequester" class="form-control" type="text"></div>
      <div class="form-group"><label for="newDesc">Justification</label><textarea id="newDesc" class="form-control" rows="3"></textarea></div>
      <button type="button" class="btn btn-primary" id="submitRequestBtn" style="width:100%"><i class="fas fa-paper-plane"></i> Submit</button>
    </aside>
  </div>
</div>

<div class="modal-overlay" id="rejectModal">
  <div class="modal">
    <h3 style="margin-bottom:.75rem;color:var(--primary)">Reject request</h3>
    <textarea id="rejectReason" rows="4" class="form-control" placeholder="Reason for rejection…"></textarea>
    <div style="display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem">
      <button type="button" class="btn btn-light" id="cancelRejectBtn">Cancel</button>
      <button type="button" class="btn btn-danger" id="confirmRejectBtn">Confirm reject</button>
    </div>
  </div>
</div>
<script src="../assets/js/approval-requests.js?v=1"></script>
</body>
</html>
