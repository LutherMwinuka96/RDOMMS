<script>
// ---------- GLOBAL PROJECTS STORAGE ----------
let masterProjects = [];
let projectHealthMap = {};

async function loadProjectHealthMap() {
  try {
    const res = await fetch("../api/projects/health.php", {
      headers: { "X-Requested-With": "XMLHttpRequest" },
      credentials: "same-origin"
    });
    const payload = await res.json();
    if (res.ok && payload?.status === "success" && Array.isArray(payload.data?.projects)) {
      projectHealthMap = {};
      payload.data.projects.forEach((row) => {
        projectHealthMap[String(row.projectId)] = row;
      });
    }
  } catch (error) {
    console.warn("Project health map load failed:", error);
  }
}

function normalizeProject(project) {
  return {
    ...project,
    id: project.project_id || project.id,
    startDate: project.startDate || project.start_date || "",
    dueDate: project.dueDate || project.end_date || "",
    createdAt: project.createdAt || project.created_at || "",
    team: Array.isArray(project.team) ? project.team : (project.team ? (() => { try { return JSON.parse(project.team); } catch (e) { return []; } })() : []),
    budget: Number(project.budget) || 0,
    beneficiaries: Number(project.beneficiaries) || 0,
    progress: Number(project.progress) || 0,
    location: project.location || project.district || "",
    status: project.status || "not-started",
    budgetApprovalStatus: project.budgetApprovalStatus || project.budget_approval_status || (Number(project.budget) > 0 ? "pending" : "draft"),
    budgetCanOperate: project.budgetCanOperate ?? project.budget_can_operate,
    budgetRejectReason: project.budgetRejectReason || project.budget_reject_reason || "",
    deregistrationStatus: project.deregistrationStatus || project.deregistration_status || "none",
  };
}

async function loadProjectsFromApi() {
  try {
    const res = await fetch(`../api/projects.php?t=${Date.now()}`, {
      headers: { "X-Requested-With": "XMLHttpRequest" },
      credentials: 'same-origin',
      cache: 'no-store'
    });
    const data = await res.json();
    if (!res.ok) {
      throw new Error(data?.message || `Failed to load projects (${res.status})`);
    }
    if (data.status === "success" && Array.isArray(data.data)) {
      masterProjects = data.data.map(normalizeProject);
      localStorage.setItem("rd_projects", JSON.stringify(masterProjects));
      return;
    }
    throw new Error(data?.message || 'Invalid projects response');
  } catch (error) {
    console.warn("API load failed, falling back to localStorage:", error);
  }

  const stored = localStorage.getItem("rd_projects");
  masterProjects = stored && stored.length > 2 ? JSON.parse(stored).map(normalizeProject) : [];
}

let currentStatusFilter = "all";

function getStatusCounts() {
  const counts = { all: masterProjects.length, ongoing: 0, completed: 0, delayed: 0, "not-started": 0 };
  masterProjects.forEach(p => { counts[p.status] = (counts[p.status] || 0) + 1; });
  return counts;
}

function renderStatusPills() {
  const counts = getStatusCounts();
  const pills = [
    { key: "all", label: "All", count: counts.all },
    { key: "ongoing", label: "Ongoing", count: counts.ongoing },
    { key: "completed", label: "Completed", count: counts.completed },
    { key: "delayed", label: "Delayed", count: counts.delayed },
    { key: "not-started", label: "Not Started", count: counts["not-started"] }
  ];
  const container = document.getElementById("statusPillsContainer");
  container.innerHTML = "";
  pills.forEach(p => {
    const pillDiv = document.createElement("div");
    pillDiv.className = `pill ${currentStatusFilter === p.key ? "active" : ""}`;
    pillDiv.innerHTML = `${p.label} <span>${p.count}</span>`;
    pillDiv.addEventListener("click", () => {
      currentStatusFilter = p.key;
      renderAllProjects(); 
      renderStatusPills();
    });
    container.appendChild(pillDiv);
  });
}

function getFilteredAndSorted() {
  let filtered = [...masterProjects];
  // status filter
  if (currentStatusFilter !== "all") {
    filtered = filtered.filter(p => p.status === currentStatusFilter);
  }
  // search
  const searchTerm = document.getElementById("searchInput").value.toLowerCase();
  if (searchTerm) {
    filtered = filtered.filter(p => p.name.toLowerCase().includes(searchTerm) || p.location.toLowerCase().includes(searchTerm) || p.sector.toLowerCase().includes(searchTerm));
  }
  // organization filter
  const organizationVal = document.getElementById("organizationFilter").value;
  if (organizationVal !== "all") {
    filtered = filtered.filter(p => p.organization === organizationVal);
  }
  // district filter
  const districtVal = document.getElementById("districtFilter").value;
  if (districtVal !== "all") {
    filtered = filtered.filter(p => p.district === districtVal);
  }
  // sector filter
  const sectorVal = document.getElementById("sectorFilter").value;
  if (sectorVal !== "all") {
    filtered = filtered.filter(p => p.sector === sectorVal);
  }
  // sorting
  const sortType = document.getElementById("sortSelect").value;
  if (sortType === "progress") filtered.sort((a,b) => b.progress - a.progress);
  else if (sortType === "budget") filtered.sort((a,b) => b.budget - a.budget);
  else if (sortType === "name") filtered.sort((a,b) => a.name.localeCompare(b.name));
  else if (sortType === "latest") filtered.sort((a,b) => (b.dueDate || "").localeCompare(a.dueDate || ""));
  return filtered;
}

function getDaysLeft(dueDate, status) {
  if (status === "completed") return { text: "Done", color: "#22c55e", icon: "fa-check-circle" };
  if (!dueDate) return { text: "No date", color: "var(--muted)" };
  const today = new Date();
  const due = new Date(dueDate);
  const diff = Math.ceil((due - today) / (1000 * 60 * 60 * 24));
  if (diff < 0) return { text: `Overdue by ${Math.abs(diff)}d`, color: "#ef4444", icon: "fa-exclamation-circle" };
  if (diff === 0) return { text: "Due today", color: "#f59e0b" };
  return { text: `${diff} days left`, color: "var(--text)" };
}

function getProgressColor(progress) {
  if (progress >= 70) return "fill-green";
  if (progress >= 40) return "fill-blue";
  return "fill-yellow";
}

function renderProjects() {
  const filtered = getFilteredAndSorted();
  const container = document.getElementById("projectsGridContainer");
  const totalSpan = document.getElementById("projectCountSpan");
  totalSpan.innerHTML = `(${filtered.length})`;
  
  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty-state"><i class="fas fa-folder-open"></i><p>No projects found. Try adjusting filters or <a href="create-project.php" style="color: var(--primary); text-decoration: none;">create a new project</a>.</p></div>`;
    return;
  }
  
  container.innerHTML = "";
  filtered.forEach(proj => {
    const progressColor = getProgressColor(proj.progress);
    const sectorIcon = proj.icon || "fa-chart-line";
    let sectorClass = "default";
    if (proj.sector === "Water") sectorClass = "water";
    else if (proj.sector === "Agriculture") sectorClass = "agri";
    else if (proj.sector === "Health") sectorClass = "health";
    else if (proj.sector === "Infrastructure") sectorClass = "road";
    else if (proj.sector === "Education") sectorClass = "school";
    else if (proj.sector === "Energy") sectorClass = "energy";
    
    const statusBadge = proj.status === "ongoing" ? '<span class="badge ongoing"><i class="fas fa-play-circle"></i> Ongoing</span>' :
                        (proj.status === "completed" ? '<span class="badge completed"><i class="fas fa-check-circle"></i> Completed</span>' :
                        (proj.status === "delayed" ? '<span class="badge delayed"><i class="fas fa-exclamation-triangle"></i> Delayed</span>' :
                        '<span class="badge not-started"><i class="fas fa-hourglass-start"></i> Not Started</span>'));
    
    const daysInfo = getDaysLeft(proj.dueDate, proj.status);
    const daysHtml = `<div class="pc-days" style="color:${daysInfo.color};">${daysInfo.icon ? `<i class="fas ${daysInfo.icon}"></i> ` : ""}<strong>${daysInfo.text}</strong></div>`;
    
    // team avatars (max 3)
    const teamList = proj.team || [];
    const visibleTeam = teamList.slice(0, 3);
    const extraCount = teamList.length - 3;
    let teamHtml = `<div class="pc-team">` + visibleTeam.map(t => `<div class="avatar-sm">${t.substring(0,2).toUpperCase()}</div>`).join('');
    if (extraCount > 0) teamHtml += `<div class="avatar-sm" style="background:#94a3b8;">+${extraCount}</div>`;
    teamHtml += `</div>`;
    
    const health = projectHealthMap[String(proj.id)];
    const healthPill = health
      ? `<span class="health-pill ${health.health}" title="${health.alerts?.length ? health.alerts.map((a) => a.label).join(', ') : 'Healthy'}"></span>`
      : "";

    const budgetBadge = window.RDOMMSProjectFinance?.renderBudgetApprovalBadge
      ? RDOMMSProjectFinance.renderBudgetApprovalBadge(proj)
      : "";
    const deregBadge = window.RDOMMSProjectFinance?.renderDeregistrationBadge
      ? RDOMMSProjectFinance.renderDeregistrationBadge(proj)
      : "";

    const card = document.createElement("div");
    card.className = "project-card";
    card.setAttribute("data-id", proj.id);
    card.innerHTML = `
      ${healthPill}
      <div class="pc-top">
        <div class="pc-icon ${sectorClass}"><i class="fas ${sectorIcon}"></i></div>
        ${statusBadge}
      </div>
      <div class="pc-title">${escapeHtml(proj.name)}</div>
      <div class="pc-loc"><i class="fas fa-map-marker-alt"></i> ${escapeHtml(proj.location)}</div>
      ${budgetBadge}
      ${deregBadge}
      <div class="pc-meta">
        <div class="pc-meta-item"><label>Budget</label><span>${typeof formatRdommsCurrencyHtml === 'function' ? formatRdommsCurrencyHtml(proj.budget) : 'TSH ' + Number(proj.budget || 0).toLocaleString('en-US')}</span></div>
        <div class="pc-meta-item"><label>Beneficiaries</label><span>${proj.beneficiaries || 0}</span></div>
        <div class="pc-meta-item"><label>Start</label><span>${proj.startDate || "—"}</span></div>
        <div class="pc-meta-item"><label>Due</label><span>${proj.dueDate || "—"}</span></div>
      </div>
      <div class="progress-wrap">
        <div class="progress-top"><span>Progress</span><span>${proj.progress}%</span></div>
        <div class="progress-bg"><div class="progress-fill ${progressColor}" style="width:${proj.progress}%"></div></div>
      </div>
      <div class="pc-footer">
        ${teamHtml}
        ${daysHtml}
        <button type="button" class="pc-remove-btn" title="Request project removal" data-remove-id="${escapeHtml(String(proj.id))}"><i class="fas fa-user-slash"></i></button>
      </div>
    `;
    const removeBtn = card.querySelector('.pc-remove-btn');
    if (removeBtn) {
      removeBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (!window.RDOMMSProjectFinance?.promptProjectDeregistration) return;
        try {
          const ok = await RDOMMSProjectFinance.promptProjectDeregistration(proj.id);
          if (ok) {
            await loadProjectsFromApi();
            renderProjects();
          }
        } catch (error) {
          alert(error.message || 'Unable to request project removal.');
        }
      });
    }
    card.addEventListener("click", (e) => {
      if (e.target.closest('.pc-remove-btn')) return;
      if(e.target.tagName === 'A' || e.target.closest('a')) return;
      const budgetLine = typeof formatRdommsCurrency === 'function' ? formatRdommsCurrency(proj.budget) : 'TSH ' + Number(proj.budget || 0).toLocaleString('en-US');
      alert(`📌 ${proj.name}\n📍 ${proj.location}\n💰 Budget: ${budgetLine}\n📈 Progress: ${proj.progress}%\n👥 Team: ${(proj.team || []).join(", ") || "None"}\n🎯 Status: ${proj.status}`);
    });
    container.appendChild(card);
  });
}

function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){ if(m === '&') return '&amp;'; if(m === '<') return '&lt;'; if(m === '>') return '&gt;'; return m;}); }

function renderAllProjects() {
  renderProjects();
}

function exportProjects() {
  if (!masterProjects.length) {
    showToast("No projects to export.");
    return;
  }
  if (!window.RDOMMSExport) {
    showToast("Export module not loaded.");
    return;
  }
  const format = document.getElementById("exportFormat")?.value || "pdf";
  const headers = ["ID", "Name", "Location", "Sector", "Budget", "Progress", "Status", "Due Date", "Beneficiaries"];
  const rows = masterProjects.map((p) => [
    p.id,
    p.name,
    p.location,
    p.sector,
    p.budget,
    `${p.progress}%`,
    p.status,
    p.dueDate,
    p.beneficiaries || 0
  ]);
  RDOMMSExport.exportData({
    format,
    title: "All Projects",
    subtitle: `Export date: ${new Date().toLocaleString()} | Total: ${masterProjects.length}`,
    headers,
    rows,
    filename: `rd_projects_${new Date().toISOString().slice(0, 10)}`
  }).then(() => showToast("Exported successfully!"))
    .catch((error) => showToast(error.message || "Export failed."));
}

function showToast(msg) {
  let t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<i class="fas fa-check-circle"></i> ${msg}`;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function populateSectorFilter() {
  const sel = document.getElementById("sectorFilter");
  if (!sel || !window.RDOMMSDepartments) return;
  const current = sel.value;
  sel.innerHTML = '<option value="all">All Sectors</option>';
  RDOMMSDepartments.list().forEach((item) => {
    const option = document.createElement("option");
    option.value = item.label;
    option.textContent = item.label;
    sel.appendChild(option);
  });
  if (current) sel.value = current;
}

// sync event listeners after dom ready
function bindEventListeners() {
  document.getElementById("searchInput").addEventListener("input", () => renderAllProjects());
  document.getElementById("organizationFilter").addEventListener("change", () => renderAllProjects());
  document.getElementById("districtFilter").addEventListener("change", () => renderAllProjects());
  document.getElementById("sectorFilter").addEventListener("change", () => renderAllProjects());
  document.getElementById("sortSelect").addEventListener("change", () => renderAllProjects());
  document.getElementById("exportBtn")?.addEventListener("click", exportProjects);
}

// also listen to storage changes across tabs
window.addEventListener("storage", (event) => {
  if (event.key === "rd_projects") {
    loadProjectsFromApi(true).then(() => loadProjectHealthMap()).then(() => {
      renderStatusPills();
      renderAllProjects();
    });
  }
});

// initialization — always fetch fresh from database
Promise.all([loadProjectsFromApi(), loadProjectHealthMap()]).then(() => {
  populateSectorFilter();
  bindEventListeners();
  renderStatusPills();
  renderAllProjects();
  const params = new URLSearchParams(window.location.search);
  if (params.get('budget_pending') === '1') {
    showToast('Project created. Budget request is awaiting approval.');
  }
});
</script>
</body>
</html>
